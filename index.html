<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Generate strong, random passwords with custom length and character types, check password strength, and copy the result to your clipboard in one click."
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <!-- Шрифт заголовка и пароля нужен сразу: качаем его параллельно с CSS, а не после разбора стилей -->
    <link
      rel="preload"
      href="/src/assets/fonts/JetBrainsMono-Bold.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <title>Frontend Mentor | Password generator app</title>
  </head>
  <body>
    <main class="generator">
      <h1 class="generator__title">Password Generator</h1>

      <!-- Поле пароля: Empty — пустое value + плейсхолдер; Filled — TS пишет value -->
      <div class="password-display">
        <label for="password" class="visually-hidden">Generated password</label>
        <div class="password-display__field">
          <input
            type="text"
            id="password"
            class="password-display__value"
            placeholder="P4$5W0rD!"
            autocomplete="off"
            spellcheck="false"
            readonly
          />
        </div>
        <!-- Живой регион: пуст при загрузке, TS вписывает «Copied» после копирования -->
        <p id="copy-status" class="password-display__status" role="status"></p>
        <button
          type="button"
          id="copy-button"
          class="password-display__copy"
          aria-label="Copy password"
        >
          <svg
            class="password-display__copy-icon"
            width="21"
            height="24"
            viewBox="0 0 21 24"
            aria-hidden="true"
            focusable="false"
          >
            <path
              fill="currentColor"
              d="M20.341 3.091 17.909.659A2.25 2.25 0 0 0 16.319 0H8.25A2.25 2.25 0 0 0 6 2.25V4.5H2.25A2.25 2.25 0 0 0 0 6.75v15A2.25 2.25 0 0 0 2.25 24h10.5A2.25 2.25 0 0 0 15 21.75V19.5h3.75A2.25 2.25 0 0 0 21 17.25V4.682a2.25 2.25 0 0 0-.659-1.591ZM12.469 21.75H2.53a.281.281 0 0 1-.281-.281V7.03a.281.281 0 0 1 .281-.281H6v10.5a2.25 2.25 0 0 0 2.25 2.25h4.5v1.969a.282.282 0 0 1-.281.281Zm6-4.5H8.53a.281.281 0 0 1-.281-.281V2.53a.281.281 0 0 1 .281-.281H13.5v4.125c0 .621.504 1.125 1.125 1.125h4.125v9.469a.282.282 0 0 1-.281.281Zm.281-12h-3v-3h.451c.075 0 .147.03.2.082L18.667 4.6a.283.283 0 0 1 .082.199v.451Z"
            />
          </svg>
        </button>
      </div>

      <!-- Карточка настроек: submit перехватывает TS и генерирует пароль без перезагрузки -->
      <form id="generator-form" class="settings">
        <div class="settings__length">
          <div class="settings__length-header">
            <label for="password-length" class="settings__label"
              >Character Length</label
            >
            <!-- aria-live="off": значение и так озвучивает сам слайдер, без дублей -->
            <output
              id="length-value"
              class="settings__length-value"
              for="password-length"
              aria-live="off"
              >0</output
            >
          </div>
          <input
            type="range"
            id="password-length"
            class="settings__slider"
            name="length"
            min="0"
            max="20"
            step="1"
            value="0"
          />
        </div>

        <fieldset class="settings__options">
          <legend class="visually-hidden">Character types</legend>

          <div class="settings__option">
            <input
              type="checkbox"
              id="include-uppercase"
              class="settings__checkbox"
              name="uppercase"
            />
            <label for="include-uppercase" class="settings__option-label"
              >Include Uppercase Letters</label
            >
          </div>

          <div class="settings__option">
            <input
              type="checkbox"
              id="include-lowercase"
              class="settings__checkbox"
              name="lowercase"
            />
            <label for="include-lowercase" class="settings__option-label"
              >Include Lowercase Letters</label
            >
          </div>

          <div class="settings__option">
            <input
              type="checkbox"
              id="include-numbers"
              class="settings__checkbox"
              name="numbers"
            />
            <label for="include-numbers" class="settings__option-label"
              >Include Numbers</label
            >
          </div>

          <div class="settings__option">
            <input
              type="checkbox"
              id="include-symbols"
              class="settings__checkbox"
              name="symbols"
            />
            <label for="include-symbols" class="settings__option-label"
              >Include Symbols</label
            >
          </div>
        </fieldset>

        <!-- Низ карточки: блок силы, кнопка Generate и подсказка; свой отступ между силой и кнопкой (16 / 32) -->
        <div class="settings__footer">
          <!--
            Состояние силы пароля: data-strength = "" | too-weak | weak | medium | strong.
            SCSS красит полоски по этому атрибуту, TS выставляет значение после генерации.
            Пустая строка — пароль ещё не сгенерирован.
            Это не живой регион: о генерации и уровне силы объявляет #generator-status.
          -->
          <div id="strength" class="strength" data-strength="">
            <p class="strength__label">Strength</p>
            <div class="strength__meter">
              <p id="strength-level" class="strength__level"></p>
              <div class="strength__bars" aria-hidden="true">
                <span class="strength__bar"></span>
                <span class="strength__bar"></span>
                <span class="strength__bar"></span>
                <span class="strength__bar"></span>
              </div>
            </div>
          </div>

          <button type="submit" class="settings__generate">
            Generate
            <svg
              class="settings__generate-icon"
              width="12"
              height="12"
              viewBox="0 0 12 12"
              aria-hidden="true"
              focusable="false"
            >
              <path
                fill="currentColor"
                d="m5.106 12 6-6-6-6-1.265 1.265 3.841 3.84H.001v1.79h7.681l-3.841 3.84z"
              />
            </svg>
          </button>

          <!-- Подсказка: пуста при загрузке, TS выводит текст, если настройки не позволяют сгенерировать пароль -->
          <p id="generator-hint" class="settings__hint" role="status"></p>
          <!-- Невидимый статус для скринридера: TS объявляет «пароль сгенерирован» и уровень силы -->
          <p id="generator-status" class="visually-hidden" role="status"></p>
        </div>
      </form>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
